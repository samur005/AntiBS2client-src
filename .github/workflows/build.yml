name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android command-line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Fetch ZeroTier Java SDK sources
        run: |
          mkdir -p android/zerotier/src/main/java/com/zerotier/sdk
          curl -fsSL "https://api.github.com/repos/zerotier/ZeroTierOne/contents/java/src/com/zerotier/sdk?ref=dev" |             python3 -c "import sys,json; [print(i['download_url']) for i in json.load(sys.stdin) if i['name'].endswith('.java')]" |             while read url; do
              fname=$(basename "$url")
              curl -fsSL "$url" -o "android/zerotier/src/main/java/com/zerotier/sdk/$fname"
            done
          ls android/zerotier/src/main/java/com/zerotier/sdk/ | head -5

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            android/app/build/outputs/apk/release/*-release.apk
            android/app/build/outputs/apk/release/*-release-unsigned.apk
